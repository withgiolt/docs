name: Check

# Pull requests are gated here. Pushes to main reach this through deploy.yml,
# which calls it, so a push is checked once rather than once here and once
# there.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

# A newer push to the same PR makes an in-flight run redundant. Called from
# deploy.yml there is no PR to supersede, so nothing is cancelled.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Cache Gleam build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build
          key: ${{ runner.os }}-gleam-build-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            ${{ runner.os }}-gleam-build-

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies
        run: |
          gleam deps download
          bun install --frozen-lockfile

      - name: Check
        run: just check

      # Generating the site is the test: it fails on a page the renderer
      # cannot parse, and on CSS that Tailwind rejects.
      - name: Build
        run: just build
